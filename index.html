<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnival Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#150F2E;
    --ink-soft:#211A44;
    --gold:#F2B705;
    --pink:#E63888;
    --teal:#2BC4B0;
    --papaya:#FF7A3D;
    --violet:#9B5DE5;
    --cloud:#F4F2FA;
    --cloud-dim:#D9D5E8;
  }
  html{background:var(--ink); min-height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cloud);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .display{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:0.02em;
  }

  /* ---- Header ---- */
  header{
    padding:28px 20px 16px;
    background:radial-gradient(120% 140% at 15% 0%, var(--ink-soft) 0%, var(--ink) 65%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .season-tag{
    font-size:13px;
    color:var(--cloud-dim);
    margin:0 0 2px;
  }
  h1.display{
    font-size:44px;
    line-height:0.9;
    margin:0 0 6px;
    background:linear-gradient(90deg,var(--gold),var(--pink) 60%,var(--violet));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{
    font-size:14px;
    color:var(--cloud-dim);
    margin:0;
  }

  /* ---- View toggle ---- */
  .view-toggle{
    display:flex;
    gap:6px;
    padding:14px 16px 0;
    background:var(--ink);
  }
  .view-btn{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.15);
    background:transparent;
    color:var(--cloud-dim);
    font-weight:700;
    font-size:13.5px;
  }
  .view-btn.active{
    background:var(--cloud);
    color:var(--ink);
    border-color:var(--cloud);
  }

  /* ---- Filters ---- */
  .filter-bar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--ink);
    padding:14px 16px 12px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    border-bottom:1px solid rgba(255,255,255,0.08);
    scrollbar-width:none;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
  }
  .filter-bar::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    border:1px solid rgba(255,255,255,0.18);
    background:transparent;
    color:var(--cloud);
    white-space:nowrap;
    cursor:pointer;
  }
  .chip.active{
    border-color:transparent;
    color:var(--ink);
  }
  .chip[data-cat="all"].active{background:var(--cloud);}
  .chip[data-cat="cooler"].active{background:var(--teal);}
  .chip[data-cat="allincl"].active{background:var(--papaya);}
  .chip[data-cat="launch"].active{background:var(--gold);}
  .chip[data-cat="boat"].active{background:var(--violet); color:#fff;}
  .chip[data-cat="free"].active{background:var(--pink); color:#fff;}
  .chip[data-cat="other"].active{background:var(--cloud-dim); color:var(--ink);}

  /* ---- List ---- */
  main{
    padding:4px 16px 100px;
    background:var(--ink);
    position:relative;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
  }
  .date-heading{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin:22px 0 10px;
    color:var(--cloud-dim);
  }
  .date-heading .num{
    font-family:'Bebas Neue',sans-serif;
    font-size:26px;
    color:var(--cloud);
  }
  .date-heading .rest{font-size:13px;}

  .fete-card{
    background:var(--cloud);
    color:var(--ink);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
    display:flex;
    cursor:pointer;
  }
  .fete-card .stripe{width:6px; flex:0 0 6px;}
  .cat-cooler .stripe{background:var(--teal);}
  .cat-allincl .stripe{background:var(--papaya);}
  .cat-launch .stripe{background:var(--gold);}
  .cat-boat .stripe{background:var(--violet);}
  .cat-free .stripe{background:var(--pink);}
  .cat-other .stripe{background:#8a84a3;}

  .fete-body{flex:1; padding:12px 14px;}
  .fete-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .fete-info{display:flex; gap:10px; align-items:flex-start; flex:1; min-width:0;}
  .thumb{
    width:52px; height:52px; flex:0 0 52px;
    border-radius:8px;
    object-fit:cover;
    background:var(--cloud-dim);
  }
  .fete-name{font-weight:700; font-size:16px; margin:0 0 3px;}
  .fete-meta{font-size:12.5px; color:#5a5570; margin:0;}
  .cat-label{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:2px 7px;
    border-radius:5px;
    margin-top:6px;
    color:#fff;
  }
  .cat-cooler .cat-label{background:var(--teal); color:#0b3d38;}
  .cat-allincl .cat-label{background:var(--papaya);}
  .cat-launch .cat-label{background:var(--gold); color:#453200;}
  .cat-boat .cat-label{background:var(--violet);}
  .cat-free .cat-label{background:var(--pink);}
  .cat-other .cat-label{background:#8a84a3;}

  .save-btn{
    flex:0 0 auto;
    width:34px; height:34px;
    border-radius:50%;
    border:1.5px solid #ccc6df;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    color:#b7b0cf;
  }
  .save-btn.saved{
    background:var(--pink);
    border-color:var(--pink);
    color:#fff;
  }

  .fete-detail{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.25s ease;
  }
  .fete-detail.open{max-height:420px;}
  .fete-detail-inner{
    padding:0 14px 14px;
    font-size:13px;
    color:#43405a;
    border-top:1px dashed #d6d1e6;
    margin-top:8px;
    padding-top:10px;
  }
  .detail-flyer{
    width:100%;
    max-height:200px;
    object-fit:cover;
    border-radius:8px;
    margin-bottom:10px;
    display:block;
  }
  .fete-detail-inner .price{font-weight:700; color:var(--ink);}
  .ticket-link{
    display:inline-block;
    margin-top:8px;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
    text-decoration:underline;
  }

  /* ---- Calendar view ---- */
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:18px 0 14px;
  }
  .cal-nav-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.2);
    background:transparent;
    color:var(--cloud);
    font-size:16px;
  }
  .cal-month-label{
    font-family:'Bebas Neue',sans-serif;
    font-size:24px;
    color:var(--cloud);
  }
  .share-month-btn{
    width:100%;
    padding:11px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    color:var(--cloud);
    font-weight:700;
    font-size:13.5px;
    margin-bottom:14px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
  }
  .cal-dow{
    text-align:center;
    font-size:11px;
    color:var(--cloud-dim);
    padding-bottom:4px;
  }
  .cal-dow.weekend{color:var(--gold); font-weight:700;}
  .cal-cell{
    min-height:64px;
    border-radius:9px;
    background:rgba(255,255,255,0.04);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:6px 3px 5px;
    gap:2px;
    position:relative;
    color:var(--cloud);
    font-size:12.5px;
  }
  .cal-cell.weekend{background:rgba(242,183,5,0.07);}
  .cal-cell.empty{background:transparent;}
  .cal-cell.has-fetes{background:rgba(255,255,255,0.09); cursor:pointer;}
  .cal-cell.has-fetes.weekend{background:rgba(242,183,5,0.13);}
  .cal-event-name{
    font-size:9px;
    line-height:1.15;
    color:var(--cloud-dim);
    text-align:center;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:100%;
    margin-top:1px;
  }
  .cal-more{font-size:8.5px; color:var(--cloud-dim); opacity:0.75;}
  .cal-legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:12px;
    padding:0 2px;
  }
  .cal-legend-item{
    display:flex; align-items:center; gap:4px;
    font-size:10.5px; color:var(--cloud-dim);
  }
  .cal-legend-dot{width:6px; height:6px; border-radius:50%; flex:0 0 auto;}
  .cal-cell.selected{
    background:var(--cloud);
    color:var(--ink);
    font-weight:700;
  }
  .cal-cell.selected .cal-event-name{color:#5a5570;}
  .cal-cell.selected .cal-more{color:#5a5570;}
  .cal-dots{display:flex; gap:2px;}
  .cal-dot{width:5px; height:5px; border-radius:50%;}
  .dot-cooler{background:var(--teal);}
  .dot-allincl{background:var(--papaya);}
  .dot-launch{background:var(--gold);}
  .dot-boat{background:var(--violet);}
  .dot-free{background:var(--pink);}
  .dot-other{background:#8a84a3;}

  .cal-week-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
    margin-bottom:5px;
  }
  .day-expand{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
    position:relative;
  }
  .day-expand-heading{
    font-size:13px;
    color:var(--cloud-dim);
    margin:0 0 10px;
    padding-right:24px;
  }
  .day-expand-close{
    position:absolute;
    top:12px; right:12px;
    background:none; border:none;
    color:var(--cloud-dim);
    font-size:18px;
  }
  .no-selection{
    text-align:center;
    color:var(--cloud-dim);
    font-size:13.5px;
    padding:16px 10px;
  }

  /* ---- Floating "My Carnival" ---- */
  .my-carnival-btn{
    position:fixed;
    bottom:20px; left:50%;
    transform:translateX(-50%);
    background:linear-gradient(90deg,var(--pink),var(--violet));
    color:#fff;
    border:none;
    padding:13px 22px;
    border-radius:30px;
    font-weight:700;
    font-size:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    display:flex; align-items:center; gap:8px;
    z-index:30;
  }
  .my-carnival-btn .count{
    background:rgba(255,255,255,0.25);
    padding:1px 8px;
    border-radius:12px;
    font-size:12px;
  }

  /* ---- Sheet ---- */
  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.5);
    z-index:40;
    display:none;
  }
  .sheet-overlay.open{display:block;}
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--ink-soft);
    border-radius:18px 18px 0 0;
    padding:18px 18px 24px;
    max-height:78vh;
    overflow-y:auto;
    transform:translateY(100%);
    transition:transform 0.28s ease;
    z-index:41;
  }
  .sheet.open{transform:translateY(0);}
  .sheet h2{margin:0 0 4px; font-family:'Bebas Neue'; font-size:28px; font-weight:400;}
  .sheet .sub{color:var(--cloud-dim); font-size:13px; margin:0 0 16px;}
  .sheet-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.1);
    font-size:14px;
  }
  .sheet-item .remove{color:var(--pink); font-size:12px; font-weight:700;}
  .empty-note{color:var(--cloud-dim); font-size:13.5px; padding:20px 0;}
  .share-box{
    margin-top:16px;
    background:rgba(255,255,255,0.06);
    border-radius:10px;
    padding:12px;
    font-size:12.5px;
    color:var(--cloud-dim);
    white-space:pre-wrap;
    line-height:1.5;
    max-height:220px;
    overflow-y:auto;
  }
  .copy-btn{
    margin-top:10px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--gold);
    color:#453200;
    font-weight:700;
    font-size:14px;
  }
  .btn-secondary{
    background:transparent;
    color:var(--cloud);
    border:1.5px solid rgba(255,255,255,0.25);
  }
  .image-card-wrap{
    margin-top:16px;
  }
  .image-card-label{
    font-size:12px;
    color:var(--cloud-dim);
    margin:0 0 8px;
  }
  .share-image-preview{
    width:100%;
    border-radius:12px;
    display:block;
    background:rgba(255,255,255,0.04);
  }
  .close-sheet{
    position:absolute; top:14px; right:16px;
    background:none; border:none; color:var(--cloud-dim);
    font-size:20px;
  }
</style>
</head>
<body>

<header>
  <p class="season-tag">CARNIVAL 2027 SEASON &middot; JAN &ndash; FEB</p>
  <h1 class="display">Fete Schedule</h1>
  <p class="subtitle">Every fete, one live calendar. Tap to save yours.</p>
</header>

<div class="view-toggle">
  <button class="view-btn active" data-view="list">List</button>
  <button class="view-btn" data-view="calendar">Calendar</button>
</div>

<div class="filter-bar" id="filterBar">
  <button class="chip active" data-cat="all">All</button>
  <button class="chip" data-cat="cooler">Cooler Fete</button>
  <button class="chip" data-cat="allincl">All-Inclusive</button>
  <button class="chip" data-cat="launch">Band Launch</button>
  <button class="chip" data-cat="boat">Boat Ride</button>
  <button class="chip" data-cat="free">Free Event</button>
  <button class="chip" data-cat="other">Other</button>
</div>

<main id="listRoot"></main>

<button class="my-carnival-btn" id="myCarnivalBtn">
  My Carnival <span class="count" id="savedCount">0</span>
</button>

<div class="sheet-overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <button class="close-sheet" id="closeSheet">&times;</button>
  <h2 class="display" id="sheetTitle">My Carnival</h2>
  <p class="sub" id="sheetSub">Your saved fetes, ready to share.</p>
  <div id="sheetList"></div>
  <div id="shareSection" style="display:none;">
    <div class="image-card-wrap">
      <p class="image-card-label">Shareable graphic</p>
      <img id="shareImagePreview" class="share-image-preview" alt="Shareable Carnival card">
    </div>
    <button class="copy-btn" id="downloadImgBtn">Download image</button>
    <button class="copy-btn btn-secondary" id="shareImgBtn" style="display:none;">Share image</button>
    <div class="share-box" id="shareText"></div>
    <button class="copy-btn btn-secondary" id="copyBtn">Copy as text</button>
  </div>
</div>

<script>
// FETES is loaded live from fetes.json (written by the scraper — see scrape.js).
// Shape per event: {id, y, m, d, name, promoter, venue, cat, price, desc, img}
// Note: m is zero-indexed, same as JS Date (January = 0).
let FETES = [];

const catLabels = {
  cooler:"Cooler Fete", allincl:"All-Inclusive",
  launch:"Band Launch", boat:"Boat Ride", free:"Free Event", other:"Event"
};

const state = {
  filter:"all",
  saved:new Set(),
  view:"list",
  calYear:2027,
  calMonth:0,
  selectedDate:null,   // "YYYY-M-D"
  sheetMode:"mine",
  loading:true
};

function dateKey(f){ return `${f.y}-${f.m}-${f.d}`; }
function fmtDate(y,m,d){
  return new Date(y,m,d).toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
function monthLabel(y,m){
  return new Date(y,m,1).toLocaleDateString('en-US',{month:'long', year:'numeric'});
}

function filteredFetes(){
  return state.filter === "all" ? FETES : FETES.filter(f=>f.cat===state.filter);
}

function renderRoot(){
  document.querySelectorAll(".view-btn").forEach(b=>b.classList.toggle("active", b.dataset.view===state.view));
  if(state.view === "list") renderListView();
  else renderCalendarView();
  updateSavedCount();
}

/* ---------- LIST VIEW ---------- */
function renderListView(){
  const root = document.getElementById("listRoot");
  const list = filteredFetes().slice().sort((a,b)=> new Date(a.y,a.m,a.d) - new Date(b.y,b.m,b.d));
  root.innerHTML = "";

  if(list.length === 0){
    const msg = state.loading
      ? "Loading fete schedule…"
      : "No fetes in this category yet.";
    root.innerHTML = `<p style="color:var(--cloud-dim); padding:30px 0; text-align:center;">${msg}</p>`;
    return;
  }

  let lastKey = null;
  list.forEach(f=>{
    const key = dateKey(f);
    if(key !== lastKey){
      const heading = document.createElement("div");
      heading.className = "date-heading";
      heading.innerHTML = `<span class="num">${f.d}</span><span class="rest">${fmtDate(f.y,f.m,f.d).split(", ")[0].toUpperCase()} &middot; ${new Date(f.y,f.m,1).toLocaleDateString('en-US',{month:'short'}).toUpperCase()}</span>`;
      root.appendChild(heading);
      lastKey = key;
    }
    root.appendChild(makeFeteCard(f));
  });

  attachCardHandlers(root);
}

function makeFeteCard(f, startOpen){
  const card = document.createElement("div");
  card.className = `fete-card cat-${f.cat}`;
  const isSaved = state.saved.has(f.id);
  card.innerHTML = `
    <div class="stripe"></div>
    <div class="fete-body">
      <div class="fete-top">
        <div class="fete-info">
          <img class="thumb" src="${f.img}" alt="${f.name} flyer">
          <div>
            <p class="fete-name">${f.name}</p>
            <p class="fete-meta">${f.promoter} &middot; ${f.venue}</p>
            <span class="cat-label">${catLabels[f.cat]}</span>
          </div>
        </div>
        <button class="save-btn ${isSaved?'saved':''}" data-id="${f.id}">${isSaved?'&hearts;':'&#9825;'}</button>
      </div>
      <div class="fete-detail" data-detail="${f.id}">
        <div class="fete-detail-inner">
          <img class="detail-flyer" src="${f.img}" alt="${f.name} flyer">
          <p>${f.desc}</p>
          <p class="price">${f.price}</p>
          <a class="ticket-link" href="#" onclick="event.stopPropagation()">Get tickets &rarr;</a>
        </div>
      </div>
    </div>
  `;
  if(startOpen){
    card.querySelector(".fete-detail").classList.add("open");
  }
  card.addEventListener("click", (e)=>{
    if(e.target.classList.contains("save-btn")) return;
    card.querySelector(".fete-detail").classList.toggle("open");
  });
  return card;
}

function attachCardHandlers(container){
  container.querySelectorAll(".save-btn").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      if(state.saved.has(id)) state.saved.delete(id); else state.saved.add(id);
      renderRoot();
    });
  });
}

/* ---------- CALENDAR VIEW ---------- */
function renderCalendarView(){
  const root = document.getElementById("listRoot");
  root.innerHTML = "";

  const header = document.createElement("div");
  header.className = "cal-header";
  header.innerHTML = `
    <button class="cal-nav-btn" id="prevMonth">&#8249;</button>
    <span class="cal-month-label">${monthLabel(state.calYear, state.calMonth)}</span>
    <button class="cal-nav-btn" id="nextMonth">&#8250;</button>
  `;
  root.appendChild(header);

  const shareBtn = document.createElement("button");
  shareBtn.className = "share-month-btn";
  shareBtn.textContent = "Share this month";
  shareBtn.addEventListener("click", ()=>openSheet("month"));
  root.appendChild(shareBtn);

  const legend = document.createElement("div");
  legend.className = "cal-legend";
  legend.innerHTML = Object.keys(catLabels).map(c=>
    `<span class="cal-legend-item"><span class="cal-legend-dot dot-${c}"></span>${catLabels[c]}</span>`
  ).join("");
  root.appendChild(legend);

  const dowRow = document.createElement("div");
  dowRow.className = "cal-grid";
  ["S","M","T","W","T","F","S"].forEach((d, idx)=>{
    const el = document.createElement("div");
    el.className = "cal-dow" + ((idx===0||idx===5||idx===6) ? " weekend" : "");
    el.textContent = d;
    dowRow.appendChild(el);
  });
  root.appendChild(dowRow);

  const firstDow = new Date(state.calYear, state.calMonth, 1).getDay();
  const daysInMonth = new Date(state.calYear, state.calMonth+1, 0).getDate();
  const monthFetes = filteredFetes().filter(f=>f.y===state.calYear && f.m===state.calMonth);

  // Build a flat list of cells (blanks + days), then chunk into weeks of 7
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let day=1; day<=daysInMonth; day++) cells.push(day);

  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));

  let anySelected = false;

  weeks.forEach(week=>{
    const weekRow = document.createElement("div");
    weekRow.className = "cal-week-row";

    week.forEach(day=>{
      const cell = document.createElement("div");
      if(day === null){
        cell.className = "cal-cell empty";
        weekRow.appendChild(cell);
        return;
      }
      const dayFetes = monthFetes.filter(f=>f.d===day);
      const key = `${state.calYear}-${state.calMonth}-${day}`;
      const isSelected = state.selectedDate === key;
      const dow = new Date(state.calYear, state.calMonth, day).getDay();
      const isWeekend = dow===0 || dow===5 || dow===6;
      cell.className = "cal-cell"
        + (dayFetes.length ? " has-fetes" : "")
        + (isSelected ? " selected" : "")
        + (isWeekend ? " weekend" : "");
      const cats = [...new Set(dayFetes.map(f=>f.cat))];
      let inner = `<span>${day}</span>`;
      if(cats.length){
        inner += `<div class="cal-dots">${cats.map(c=>`<span class="cal-dot dot-${c}"></span>`).join("")}</div>`;
      }
      if(dayFetes.length){
        let short = dayFetes[0].name;
        if(short.length > 12) short = short.slice(0,11) + '…';
        inner += `<span class="cal-event-name">${short}</span>`;
        if(dayFetes.length > 1){
          inner += `<span class="cal-more">+${dayFetes.length - 1} more</span>`;
        }
      }
      cell.innerHTML = inner;
      if(dayFetes.length){
        cell.addEventListener("click", ()=>{
          state.selectedDate = isSelected ? null : key;
          renderCalendarView();
        });
      }
      weekRow.appendChild(cell);
    });

    root.appendChild(weekRow);

    // If the selected day falls in this week, expand it right here
    const selectedInThisWeek = week.some(day=>day && `${state.calYear}-${state.calMonth}-${day}` === state.selectedDate);
    if(selectedInThisWeek){
      anySelected = true;
      const [sy,sm,sd] = state.selectedDate.split("-").map(Number);
      const dayFetes = monthFetes.filter(f=>f.y===sy && f.m===sm && f.d===sd);

      const expand = document.createElement("div");
      expand.className = "day-expand";
      expand.innerHTML = `
        <button class="day-expand-close">&times;</button>
        <p class="day-expand-heading">${fmtDate(sy,sm,sd).toUpperCase()}</p>
      `;
      dayFetes.forEach(f=>expand.appendChild(makeFeteCard(f, true)));
      expand.querySelector(".day-expand-close").addEventListener("click", ()=>{
        state.selectedDate = null;
        renderCalendarView();
      });
      root.appendChild(expand);
      attachCardHandlers(expand);
    }
  });

  if(!anySelected){
    const hint = document.createElement("p");
    hint.className = "no-selection";
    hint.textContent = "Tap a day with a dot to see what's on.";
    root.appendChild(hint);
  }

  document.getElementById("prevMonth").addEventListener("click", ()=>{
    state.calMonth--;
    if(state.calMonth<0){state.calMonth=11; state.calYear--;}
    state.selectedDate = null;
    renderCalendarView();
  });
  document.getElementById("nextMonth").addEventListener("click", ()=>{
    state.calMonth++;
    if(state.calMonth>11){state.calMonth=0; state.calYear++;}
    state.selectedDate = null;
    renderCalendarView();
  });
}

document.querySelectorAll(".view-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    state.view = btn.dataset.view;
    renderRoot();
  });
});

document.getElementById("filterBar").addEventListener("click", (e)=>{
  if(!e.target.classList.contains("chip")) return;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  e.target.classList.add("active");
  state.filter = e.target.dataset.cat;
  renderRoot();
});

function updateSavedCount(){
  document.getElementById("savedCount").textContent = state.saved.size;
}

/* ---------- SHEET ---------- */
const sheet = document.getElementById("sheet");
const overlay = document.getElementById("overlay");

function openSheet(mode){
  state.sheetMode = mode;
  renderSheet();
  overlay.classList.add("open");
  sheet.classList.add("open");
}
function closeSheet(){
  overlay.classList.remove("open");
  sheet.classList.remove("open");
}
document.getElementById("myCarnivalBtn").addEventListener("click", ()=>openSheet("mine"));
document.getElementById("closeSheet").addEventListener("click", closeSheet);
overlay.addEventListener("click", closeSheet);

function renderSheet(){
  const listEl = document.getElementById("sheetList");
  const shareSection = document.getElementById("shareSection");
  const titleEl = document.getElementById("sheetTitle");
  const subEl = document.getElementById("sheetSub");
  const copyBtn = document.getElementById("copyBtn");

  if(state.sheetMode === "mine"){
    titleEl.textContent = "My Carnival";
    subEl.textContent = "Your saved fetes, ready to share.";
    copyBtn.textContent = "Copy my Carnival list";
    const savedFetes = FETES.filter(f=>state.saved.has(f.id)).sort((a,b)=> new Date(a.y,a.m,a.d) - new Date(b.y,b.m,b.d));

    if(savedFetes.length === 0){
      listEl.innerHTML = '<p class="empty-note">Nothing saved yet — tap the heart on any fete to build your season here.</p>';
      shareSection.style.display = "none";
      return;
    }
    listEl.innerHTML = savedFetes.map(f=>`
      <div class="sheet-item">
        <span>${fmtDate(f.y,f.m,f.d)} &middot; ${f.name}</span>
        <span class="remove" data-id="${f.id}">Remove</span>
      </div>
    `).join("");
    listEl.querySelectorAll(".remove").forEach(el=>{
      el.addEventListener("click", ()=>{
        state.saved.delete(parseInt(el.dataset.id));
        renderRoot();
        renderSheet();
      });
    });
    document.getElementById("shareText").textContent =
      "My Carnival 2027:\n" + savedFetes.map(f=>`${fmtDate(f.y,f.m,f.d)} - ${f.name} (${f.promoter})`).join("\n");
    shareSection.style.display = "block";
    refreshShareImage(
      savedFetes.map(f=>({name:f.name, cat:f.cat, dateLabel:fmtDate(f.y,f.m,f.d)})),
      "MY CARNIVAL",
      "Carnival 2027 Season"
    );

  } else {
    // month mode
    titleEl.textContent = monthLabel(state.calYear, state.calMonth);
    subEl.textContent = "The full month, ready to send.";
    copyBtn.textContent = "Copy this month's schedule";
    const monthFetes = FETES.filter(f=>f.y===state.calYear && f.m===state.calMonth)
      .sort((a,b)=> a.d - b.d);

    listEl.innerHTML = monthFetes.map(f=>`
      <div class="sheet-item">
        <span>${fmtDate(f.y,f.m,f.d)} &middot; ${f.name}</span>
        <span style="color:var(--cloud-dim); font-size:11px;">${catLabels[f.cat]}</span>
      </div>
    `).join("");
    document.getElementById("shareText").textContent =
      `${monthLabel(state.calYear, state.calMonth)} Fete Schedule:\n` +
      monthFetes.map(f=>`${fmtDate(f.y,f.m,f.d)} - ${f.name} (${f.promoter}) - ${catLabels[f.cat]}`).join("\n");
    shareSection.style.display = "block";
    refreshShareImage(
      monthFetes.map(f=>({name:f.name, cat:f.cat, dateLabel:fmtDate(f.y,f.m,f.d)})),
      monthLabel(state.calYear, state.calMonth).toUpperCase(),
      "Fete Schedule"
    );
  }
}

/* ---------- SHAREABLE IMAGE ---------- */
const CAT_HEX = {cooler:'#2BC4B0', allincl:'#FF7A3D', launch:'#F2B705', boat:'#9B5DE5', free:'#E63888'};

async function buildShareCard(title, subtitle, items){
  const W = 720, H = 1280;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // background
  const bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0, '#211A44');
  bg.addColorStop(1, '#150F2E');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  // soft color glows for brand texture
  ctx.save();
  ctx.filter = 'blur(70px)';
  ctx.fillStyle = 'rgba(230,56,136,0.35)';
  ctx.beginPath(); ctx.arc(600,110,150,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(155,93,229,0.30)';
  ctx.beginPath(); ctx.arc(70,1180,190,0,Math.PI*2); ctx.fill();
  ctx.restore();

  try{
    await document.fonts.load("84px 'Bebas Neue'");
    await document.fonts.load("22px 'Work Sans'");
    await document.fonts.load("bold 30px 'Work Sans'");
  }catch(e){ /* fall back to default fonts if load fails */ }

  ctx.fillStyle = '#D9D5E8';
  ctx.font = "24px 'Work Sans', sans-serif";
  ctx.fillText(subtitle.toUpperCase(), 48, 84);

  ctx.fillStyle = '#F4F2FA';
  ctx.font = "84px 'Bebas Neue', sans-serif";
  ctx.fillText(title, 46, 172);

  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.moveTo(48,204); ctx.lineTo(W-48,204); ctx.stroke();

  const maxRows = 10;
  const shown = items.slice(0, maxRows);
  let y = 258;
  shown.forEach(item=>{
    ctx.fillStyle = CAT_HEX[item.cat] || '#F4F2FA';
    ctx.beginPath(); ctx.arc(62, y-9, 7, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#D9D5E8';
    ctx.font = "21px 'Work Sans', sans-serif";
    ctx.fillText(item.dateLabel.toUpperCase(), 86, y-16);

    ctx.fillStyle = '#F4F2FA';
    ctx.font = "bold 30px 'Work Sans', sans-serif";
    let name = item.name;
    if(name.length > 30) name = name.slice(0,28) + '…';
    ctx.fillText(name, 86, y+18);

    y += 76;
  });

  if(items.length > maxRows){
    ctx.fillStyle = '#D9D5E8';
    ctx.font = "22px 'Work Sans', sans-serif";
    ctx.fillText(`+ ${items.length - maxRows} more on the app`, 86, y);
  }

  // footer branding — this is the growth loop: every shared card carries it
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(0, H-114, W, 114);
  ctx.fillStyle = '#F2B705';
  ctx.font = "bold 28px 'Work Sans', sans-serif";
  ctx.fillText('FETE SCHEDULE', 48, H-58);
  ctx.fillStyle = '#D9D5E8';
  ctx.font = "20px 'Work Sans', sans-serif";
  ctx.fillText('Build your own Carnival calendar', 48, H-26);

  return canvas.toDataURL('image/png');
}

let currentShareImage = null;

async function refreshShareImage(items, title, subtitle){
  const preview = document.getElementById('shareImagePreview');
  if(items.length === 0){
    preview.removeAttribute('src');
    currentShareImage = null;
    return;
  }
  const dataUrl = await buildShareCard(title, subtitle, items);
  preview.src = dataUrl;
  currentShareImage = dataUrl;
}

document.getElementById('downloadImgBtn').addEventListener('click', ()=>{
  if(!currentShareImage) return;
  const a = document.createElement('a');
  a.href = currentShareImage;
  a.download = 'carnival-schedule.png';
  a.click();
});

if(navigator.share){
  document.getElementById('shareImgBtn').style.display = 'block';
}
document.getElementById('shareImgBtn').addEventListener('click', async ()=>{
  if(!currentShareImage) return;
  try{
    const res = await fetch(currentShareImage);
    const blob = await res.blob();
    const file = new File([blob], 'carnival-schedule.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'My Carnival Schedule'});
    } else {
      throw new Error('file sharing unsupported');
    }
  }catch(e){
    alert('Sharing isn\'t supported in this browser — use Download instead.');
  }
});

document.getElementById('copyBtn').addEventListener('click', ()=>{
  const text = document.getElementById("shareText").textContent;
  const btn = document.getElementById("copyBtn");
  const original = btn.textContent;
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent = "Copied!";
    setTimeout(()=>{ btn.textContent = original; }, 1500);
  }).catch(()=>{
    btn.textContent = "Select the text above to copy";
  });
});

async function loadFetes(){
  try{
    const res = await fetch('fetes.json', {cache:'no-store'});
    if(!res.ok) throw new Error('fetes.json not found (' + res.status + ')');
    FETES = await res.json();
  }catch(err){
    console.error('Could not load fetes.json:', err);
    FETES = [];
  }
  state.loading = false;
  renderRoot();
}

loadFetes();
