name: Scrape fete listings

on:
  schedule:
    # Runs once a day at 12:00 UTC (~8am AST). Adjust the cron value if
    # you want it to run more or less often during peak Carnival season.
    - cron: '0 12 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: node scrape.js

      - name: Commit updated fetes.json (if anything changed)
        run: |
          git config user.name "fete-scraper-bot"
          git config user.email "actions@github.com"
          git add fetes.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update fete listings"
          git push
